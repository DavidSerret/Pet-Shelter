app = 'happinest'
primary_region = 'mad'

[build]

[env]
  APP_ENV = 'production'
  APP_DEBUG = 'false'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'error'
  SESSION_DRIVER = 'database'
  CACHE_STORE = 'database'
  QUEUE_CONNECTION = 'database'
  FILESYSTEM_DISK = 'local'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
